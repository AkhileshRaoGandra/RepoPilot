[project]
name = "repopilot-backend"
version = "0.9.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "GitPython>=3.1,<4.0",
    "pydantic>=2.0,<3.0",
    "tree-sitter>=0.24,<1.0",
    "tree-sitter-python>=0.23,<1.0",
    "tree-sitter-javascript>=0.23,<1.0",
    "tree-sitter-java>=0.23,<1.0",
    "torch",
    "sentence-transformers>=3.0,<4.0",
    "qdrant-client>=1.12,<2.0",
    "pywin32>=312; sys_platform == 'win32'",
    "langgraph>=0.2,<2.0",
    "networkx>=3.0,<4.0",
    "python-dotenv>=1.0.0",
]

[tool.vercel]
entrypoint = "main:app"

[tool.uv]
index-strategy = "unsafe-best-match"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
